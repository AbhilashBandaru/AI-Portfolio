    content="Contact Abhilash Bandaru regarding AI, machine learning, software development and project opportunities."

<body>

   <header>

    <h1>Abhilash Bandaru</h1>

    <button
        id="menu-button"
        class="menu-button"
        aria-label="Open navigation menu"
        aria-expanded="false"
    >
        ☰
    </button>
    <button
    id="theme-button"
    class="theme-button"
    aria-label="Switch to dark mode"
>
    🌙
</button>

    <nav id="main-nav">

        <ul>

            <li>

            </li>

        </ul>

    </nav>

</header>

    <main>

    <section id="contact">

        <div class="container">

            <h1>Contact Me</h1>

            <p class="section-description">
                Have a project idea, opportunity or question?
                Feel free to get in touch.
            </p>


            <form
                id="contact-form"
                novalidate
            >

                <div>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                    <small id="name-error"></small>

                </div>


                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                    <small id="email-error"></small>

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message"
                    ></textarea>

                    <small id="message-error"></small>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Send Message
                </button>

                <p
                    id="form-success"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </section>

</main>
<button
    id="scroll-top-button"
    class="scroll-top-button"
    aria-label="Scroll to top"

</button>
